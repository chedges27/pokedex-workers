x-app-env: &app-env
  REDIS_URL: redis://redis:6379/0
  DATABASE_URL: postgresql+psycopg://pokedex:pokedex@postgres:5432/pokedex_workers
  S3_BUCKET: pokedex
  S3_ENDPOINT_URL: http://minio:9000
  AWS_ACCESS_KEY_ID: minio
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_DEFAULT_REGION: us-east-1
  S3_PREFIX: pokemondb/
  SCRAPE_MIN_INTERVAL_SECONDS: "1"
  WORKER_QUEUES: pipelines characters character_moves moves dexes

x-app-build: &app-build
  build: .
  image: pokedex-workers
  environment:
    <<: *app-env
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pokedex
      POSTGRES_PASSWORD: pokedex
      POSTGRES_DB: pokedex_workers
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokedex -d pokedex_workers"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 minio minioadmin; do sleep 1; done
        mc mb --ignore-existing local/pokedex

  dashboard:
    <<: *app-build
    command: rq-dashboard --redis-url redis://redis:6379/0 --bind 0.0.0.0 --port 9181
    ports:
      - "9181:9181"
    depends_on:
      redis:
        condition: service_healthy

  migrate:
    <<: *app-build
    command: alembic upgrade head
    restart: "no"

  worker:
    <<: *app-build
    command: ["/app/worker.sh"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker-pipelines:
    <<: *app-build
    profiles: ["split"]
    environment:
      <<: *app-env
      WORKER_QUEUES: pipelines
    command: ["/app/worker.sh"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker-characters:
    <<: *app-build
    profiles: ["split"]
    environment:
      <<: *app-env
      WORKER_QUEUES: characters
    command: ["/app/worker.sh"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker-character-moves:
    <<: *app-build
    profiles: ["split"]
    environment:
      <<: *app-env
      WORKER_QUEUES: character_moves
    command: ["/app/worker.sh"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker-moves:
    <<: *app-build
    profiles: ["split"]
    environment:
      <<: *app-env
      WORKER_QUEUES: moves
    command: ["/app/worker.sh"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker-dexes:
    <<: *app-build
    profiles: ["split"]
    environment:
      <<: *app-env
      WORKER_QUEUES: dexes
    command: ["/app/worker.sh"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
